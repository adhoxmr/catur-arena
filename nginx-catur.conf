server {
    listen 80;
    server_name spingu.smkn1pulaurakyat.sch.id;

    # For deploy under /catur (robust SPA config)
    location /catur {
        alias /home/catur/catur-arena/client/dist;
        try_files $uri $uri/ /catur/index.html;
    }

    location /catur/ {
        alias /home/catur/catur-arena/client/dist/;
        try_files $uri $uri/ /catur/index.html;
    }

    # API and websocket at root (frontend calls use full domain)
    location /api {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /socket.io {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
